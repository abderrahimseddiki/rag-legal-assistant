name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Les tests unitaires ne dépendent que de modules en Python pur :
      # pas besoin d'installer torch / sentence-transformers en CI.
      - run: pip install pytest ruff
      - run: ruff check src tests eval
      - run: pytest -q
