[project]
name = "rag-legal-assistant"
version = "0.1.0"
description = "Assistant RAG sur des textes juridiques belges et des règlements universitaires, avec réponses citées et vérifiables."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
